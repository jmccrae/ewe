[package]
name = "ewe-dioxus"
version = "0.1.0"
authors = ["John P. McCrae <john@mccr.ae>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# The compiled binary/app is named "ewe" (not the crate's own "ewe-dioxus") - the user-facing name
# people actually see (installed app, Start Menu entry, `ewe` on a Linux $PATH, etc.) shouldn't
# carry an internal implementation detail like "-dioxus" in it.
[[bin]]
name = "ewe"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7.3", features = ["router", "fullstack"] }
phf = { version = "0.13.1", features = ["macros"] }
ewe_lib = { workspace = true , features = ["redb"] }
toml = "1.0.4"
serde = "1.0.228"
thiserror = "2.0.18"
oxrdf = { version = "0.3.3", optional = true }
oxrdfio = { version = "0.2.4", optional = true }
quick-xml = { version = "0.37.5", optional = true }
# Only used to format change-log timestamps (`backend::edit::get_changelog`), on `server` and
# `desktop` - no "clock" feature, since that needs current-time access that doesn't build cleanly
# on wasm32; formatting an already-known `u64` millis value doesn't need it.
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
# Only used on `server` and `desktop`, to run save/validate on a blocking thread pool (see
# `backend::edit::save_lexicon`/`validate_lexicon`) so a concurrent progress-poll request isn't
# starved by their long synchronous scans. Already pulled in transitively via `dioxus/server` and
# (with its own default `tokio_runtime` feature) `dioxus/desktop`, but `spawn_blocking` still needs
# to be nameable as a direct dependency of this crate to be called from our own code.
tokio = { version = "1", features = ["rt"], optional = true }
percent-encoding = "2.3.2"
teanga = { git = "https://github.com/TeangaNLP/teanga.rs", branch = "main", features = ["redb"] }
# Native folder-picker dialog for the desktop setup screen (components::setup_needed). Version/
# feature set matched to what dioxus-desktop itself already resolves (see Cargo.lock) so Cargo
# unifies them instead of linking a second native dialog backend.
rfd = { version = "0.17", optional = true, default-features = false, features = ["xdg-portal"] }

[features]
default = ["web"]
# The feature that are only required for the web = ["dioxus/web"] build target should be optional and only enabled in the web = ["dioxus/web"] feature
web = ["dioxus/web"]
# The feature that are only required for the desktop = ["dioxus/desktop"] build target should be optional and only enabled in the desktop = ["dioxus/desktop"] feature
# Desktop is a trusted, single-user deployment (unlike the public en-word.net web target), so it
# pulls in `edit` by default. Unlike `web`/`server` (which are always two separately-built
# binaries - a WASM client plus a server - talking over HTTP), `desktop` is one single
# self-contained binary with no server process at all: every `#[get]`/`#[post]` function in
# `backend/` is `#[cfg_attr(not(feature = "desktop"), get(...)/post(...))]`, so on a desktop build
# the macro is skipped entirely and they're just plain async fns called directly in-process (see
# `backend::setup`'s module doc comment). `dep:chrono`/`dep:tokio` are needed here for the same
# reason `server` needs them below - `backend::edit`'s real bodies (changelog timestamp
# formatting, save/validate's blocking thread pool) now run for desktop too, not just server.
desktop = ["dioxus/desktop", "edit", "dep:rfd", "dep:chrono", "dep:tokio"]
# The feature that are only required for the mobile = ["dioxus/mobile"] build target should be optional and only enabled in the mobile = ["dioxus/mobile"] feature
mobile = ["dioxus/mobile"]
# Gates the Wordnet editor UI and any write-capable backend routes. Off by default (including
# for `web` and `mobile`) since the web build powers the public, read-only en-word.net; `desktop`
# turns it on above. Enable explicitly with `--features edit` to test editing on web/mobile
# (needs both the client and server binary built with it, since those remain separate there).
edit = []
# The feature that are only required for the server = ["dioxus/server"] build target should be optional and only enabled in the server = ["dioxus/server"] feature
server = ["dioxus/server", "dep:oxrdf", "dep:oxrdfio", "dep:quick-xml", "dep:chrono", "dep:tokio"]
oxrdf = ["dep:oxrdf"]
oxrdfio = ["dep:oxrdfio"]
quick-xml = ["dep:quick-xml"]
