[application]
name = "EWE Wordnet Editor"

[bundle]
identifier = "ie.universityofgalway.ewe-dioxus"
publisher = "University of Galway"
icon = [
    "assets/icons/32x32.png",
    "assets/icons/128x128.png",
    "assets/icons/128x128@2x.png",
    "assets/icons/256x256.png",
    "assets/icons/512x512.png",
]
short_description = "A free, open lexical database browser and editor"
long_description = """
EWE is a browser and editor for Wordnet-style lexical databases (definitions, examples, \
lemmas, and semantic relations), including the Open English Wordnet.
"""
category = "Education"
copyright = "Copyright © University of Galway"

[bundle.deb]
# dx's deb bundler doesn't run dpkg-shlibdeps, so none of the app's runtime library
# dependencies are declared by default - apt won't pull any of them in. These are the shared
# libs the desktop binary actually links against (checked with `ldd`). libgtk-3-0 lists both
# the pre- and post- 64-bit-time_t package names ("|" = apt alternative) since Ubuntu renamed
# it to libgtk-3-0t64 in 24.04+ while older releases still ship libgtk-3-0.
depends = [
    "libxdo3",
    "libwebkit2gtk-4.1-0",
    "libjavascriptcoregtk-4.1-0",
    "libgtk-3-0 | libgtk-3-0t64",
]

[web.app]

# HTML title tag content
title = "EWE Wordnet Editor"

# include `assets` in web platform
[web.resource]

# Additional CSS style files
style = []

# Additional JavaScript files
script = []

[web.resource.dev]

# Javascript code file
# serve: [dev-server] only
script = []
