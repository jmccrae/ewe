[package]
name = "ewe-cli"
version = "0.2.1"
authors = ["John P. McCrae <john@mccr.ae>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
indicatif = "0.18.4"
ewe_lib = { workspace = true, features = ["rdf"] }
lazy_static = "*"
regex = "*"
serde_yaml = "*"
clap = { version = "4.6.1", features = [ "derive" ] }
