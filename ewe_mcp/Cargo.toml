[package]
name = "ewe-mcp"
version = "0.2.1"
authors = ["John P. McCrae <john@mccr.ae>"]
edition = "2021"

[[bin]]
name = "ewe-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
ewe_lib = { workspace = true, features = ["schema"] }
rmcp = { version = "3.1.2", features = ["transport-io"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
