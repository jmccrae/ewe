on:
  push:
    tags:
      - 'v*'

name: cargo-win

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p ewe-cli
      - run: cp target/release/ewe-cli.exe ewe-cli-windows.exe
      - run: cargo build --release -p ewe-mcp
      - run: cp target/release/ewe-mcp.exe ewe-mcp-windows.exe
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ewe-cli-windows.exe
            ewe-mcp-windows.exe
          prerelease: false
          generate_release_notes: true

  # Builds the desktop app as a single self-contained binary (see ewe_dioxus/src/backend/setup.rs
  # for why `desktop` doesn't need a separate server process) and packages it as an .msi installer.
  build_desktop_installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install dioxus-cli --version 0.7.9 --locked
      - run: dx bundle --package ewe-dioxus --desktop --no-default-features --features "desktop edit" --release --package-types msi
      - run: cp target/dx/ewe/bundle/windows/msi/*.msi ewe-windows.msi
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ewe-windows.msi
          prerelease: false
          generate_release_notes: true
