on:
  push:
    tags:
      - 'v*'

name: cargo-macos

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p ewe-cli
      - run: cp target/release/ewe-cli ewe-cli-macos
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ewe-cli-macos
          prerelease: false
          generate_release_notes: true

  # Builds the desktop app as a single self-contained binary (see ewe_dioxus/src/backend/setup.rs
  # for why `desktop` doesn't need a separate server process) and packages it as a .dmg.
  build_desktop_installer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install dioxus-cli --version 0.7.9 --locked
      - run: dx bundle --package ewe-dioxus --desktop --no-default-features --features "desktop edit" --release --package-types dmg
      - run: cp target/dx/ewe/bundle/macos/dmg/*.dmg ewe-macos.dmg
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ewe-macos.dmg
          prerelease: false
          generate_release_notes: true
